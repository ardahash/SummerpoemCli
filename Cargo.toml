[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/pow",
    "crates/crypto",
    "crates/node",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sump-core = { path = "crates/core" }
sump-pow = { path = "crates/pow" }
sump-crypto = { path = "crates/crypto" }
sump-node = { path = "crates/node" }

sha3 = "0.10"
primitive-types = "0.13"
hex = "0.4"
thiserror = "2"
fips204 = "0.4"
rand_core = "0.6"
rand_chacha = "0.3"
getrandom = "0.2"
bech32 = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"

# PoW and signature verification are unusably slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
