<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summerpoem wallet</title>
<style>
  :root {
    --paper: #F7F5EC; --ink: #1B241D; --ink-soft: #4A544C; --line: #D9D4C2;
    --gold: #A87A12; --gold-strong: #8A6410; --leaf: #3E6B4A; --card: #FFFFFF;
    --bad: #a13b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E140F; --ink: #EDE8D8; --ink-soft: #A8AC9C; --line: #2A342B;
      --gold: #E0B54A; --gold-strong: #EDC661; --leaf: #7FB08B; --card: #151D16;
      --bad: #e0876f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; line-height: 1.5; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  h1 { font-style: italic; font-weight: 400; font-size: 1.8rem; margin: 0; }
  .net { font-family: ui-monospace, monospace; font-size: 0.7rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold);
    border-radius: 999px; padding: 0.2rem 0.7rem; }
  .verse { color: var(--ink-soft); font-style: italic; margin: 0.3rem 0 2rem; }

  .balance-card { background: var(--card); border: 1px solid var(--line); padding: 1.6rem 1.4rem; margin-bottom: 1.2rem; }
  .balance-card .label { font-family: ui-monospace, monospace; font-size: 0.64rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold); margin: 0 0 0.4rem; }
  .balance-card .big { font-size: 2.4rem; font-variant-numeric: tabular-nums; line-height: 1; }
  .balance-card .big small { font-size: 1rem; color: var(--ink-soft); }
  .balance-card .pending { color: var(--ink-soft); font-size: 0.9rem; margin-top: 0.5rem; }

  .rows { border: 1px solid var(--line); background: var(--card); margin-bottom: 1.6rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.7rem 1.1rem; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .row .k { color: var(--ink-soft); font-size: 0.82rem; white-space: nowrap; }
  .row .v { font-family: ui-monospace, monospace; font-size: 0.76rem; word-break: break-all; text-align: right; }
  .copy { cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--gold);
    border-radius: 4px; font-size: 0.68rem; padding: 0.18rem 0.5rem; margin-left: 0.4rem; }
  .copy:hover { border-color: var(--gold); }

  h2 { font-size: 1.1rem; font-style: italic; font-weight: 400; margin: 0 0 0.8rem; }
  .send { background: var(--card); border: 1px solid var(--line); padding: 1.3rem 1.4rem; }
  label { display: block; font-size: 0.75rem; color: var(--ink-soft); margin: 0.7rem 0 0.25rem; }
  input { width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--line); border-radius: 4px;
    background: var(--paper); color: var(--ink); font-family: ui-monospace, monospace; font-size: 0.85rem; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.send-btn { margin-top: 1rem; width: 100%; padding: 0.75rem; border: none; border-radius: 4px;
    background: var(--gold); color: var(--paper); font-family: ui-monospace, monospace; font-size: 0.9rem; cursor: pointer; }
  button.send-btn:hover { background: var(--gold-strong); }
  button.send-btn:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 0.9rem; font-size: 0.85rem; word-break: break-all; }
  .msg.ok { color: var(--leaf); }
  .msg.err { color: var(--bad); }
  footer { margin-top: 1.5rem; color: var(--ink-soft); font-size: 0.78rem; }
  .offline { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Summerpoem wallet</h1>
    <span class="net" id="net">…</span>
  </header>
  <p class="verse">What if life was meant to be lived.</p>

  <div class="balance-card">
    <p class="label">Spendable balance</p>
    <div class="big"><span id="balance">—</span> <small>SUMP</small></div>
    <div class="pending" id="pending"></div>
  </div>

  <div class="rows">
    <div class="row">
      <span class="k">Receive (address)</span>
      <span class="v"><span id="address">—</span><button class="copy" onclick="copyText('address')">copy</button></span>
    </div>
    <div class="row">
      <span class="k">Vault (cold storage)</span>
      <span class="v"><span id="vault">—</span><button class="copy" onclick="copyText('vault')">copy</button></span>
    </div>
  </div>

  <h2>Send SUMP</h2>
  <div class="send">
    <label for="to">To address</label>
    <input id="to" placeholder="sump1q…" autocomplete="off">
    <label for="amount">Amount (SUMP)</label>
    <input id="amount" placeholder="1.5" autocomplete="off" inputmode="decimal">
    <label for="fee">Fee (stanzas)</label>
    <input id="fee" value="100000" autocomplete="off" inputmode="numeric">
    <button class="send-btn" id="sendbtn" onclick="doSend()">Send</button>
    <div class="msg" id="msg"></div>
  </div>

  <footer id="foot">Connecting to node…</footer>
</div>

<script>
  function copyText(id) {
    const t = document.getElementById(id).textContent;
    navigator.clipboard.writeText(t);
  }
  async function refresh() {
    try {
      const d = await (await fetch("/status")).json();
      document.getElementById("net").textContent = d.network || "—";
      document.getElementById("address").textContent = d.address;
      document.getElementById("vault").textContent = d.vault;
      if (d.connected) {
        document.getElementById("balance").textContent =
          d.balance.toLocaleString(undefined, {maximumFractionDigits: 8});
        document.getElementById("pending").textContent =
          d.pending > 0 ? ("+ " + d.pending.toLocaleString(undefined, {maximumFractionDigits: 8}) + " SUMP maturing") : "";
        document.getElementById("foot").textContent =
          "Connected to node " + d.node + " · height " + d.height + " · " + new Date().toLocaleTimeString();
        document.getElementById("foot").classList.remove("offline");
      } else {
        document.getElementById("balance").textContent = "—";
        document.getElementById("foot").textContent = "Node offline: " + (d.error || "unreachable");
        document.getElementById("foot").classList.add("offline");
      }
    } catch (e) {
      document.getElementById("foot").textContent = "Wallet not responding.";
    }
  }
  async function doSend() {
    const to = document.getElementById("to").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const fee = parseInt(document.getElementById("fee").value.trim() || "100000", 10);
    const msg = document.getElementById("msg");
    const btn = document.getElementById("sendbtn");
    if (!to || !amount) { msg.className = "msg err"; msg.textContent = "Enter a recipient and amount."; return; }
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Signing and submitting…";
    try {
      const r = await (await fetch("/send", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({to, amount, fee})
      })).json();
      if (r.txid) {
        msg.className = "msg ok"; msg.textContent = "Sent. txid: " + r.txid;
        document.getElementById("to").value = ""; document.getElementById("amount").value = "";
        setTimeout(refresh, 500);
      } else {
        msg.className = "msg err"; msg.textContent = "Failed: " + (r.error || "unknown error");
      }
    } catch (e) {
      msg.className = "msg err"; msg.textContent = "Failed: " + e;
    }
    btn.disabled = false;
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
